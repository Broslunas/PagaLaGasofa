<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>

  <!-- Subtle glow inner border -->
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Gas Pump Body & Hose icon -->
  <g filter="url(#shadow)" transform="translate(100, 96)">
    <!-- Main Pump Body -->
    <rect x="20" y="80" width="180" height="240" rx="24" fill="url(#metalGrad)"/>

    <!-- Fuel Meter Screen -->
    <rect x="45" y="115" width="130" height="70" rx="12" fill="#18181b"/>
    <!-- Euro symbol in screen -->
    <text x="110" y="162" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ea580c" text-anchor="middle">€</text>

    <!-- Pump Base -->
    <rect x="0" y="295" width="220" height="25" rx="8" fill="#18181b"/>

    <!-- Fuel Hose -->
    <path d="M 200 130 C 265 130, 280 200, 275 250 C 270 280, 255 295, 235 295" fill="none" stroke="#18181b" stroke-width="22" stroke-linecap="round"/>

    <!-- Nozzle / Handle -->
    <path d="M 275 180 L 295 140 L 310 140 L 305 180 Z" fill="#18181b"/>
    <path d="M 295 140 L 270 95 L 250 100" fill="none" stroke="#18181b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
