<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="dropGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="10" y="10" width="492" height="492" rx="120" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2"/>

  <!-- Fuel drop shape (teardrop / route pin), centered -->
  <path
    d="M256 96
       C 256 96, 356 226, 356 306
       C 356 361.2, 311.2 406, 256 406
       C 200.8 406, 156 361.2, 156 306
       C 156 226, 256 96, 256 96 Z"
    fill="url(#dropGrad)"
  />

  <!-- Road line splitting the drop in half, representing shared cost -->
  <path d="M256 168 L256 388" stroke="#ea580c" stroke-width="14" stroke-linecap="round" stroke-dasharray="26 22"/>

  <!-- Two small circles = two friends splitting the ride, sitting at the base -->
  <circle cx="222" cy="322" r="19" fill="#ea580c"/>
  <circle cx="290" cy="322" r="19" fill="#c2410c"/>
</svg>
